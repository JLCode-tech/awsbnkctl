# cluster.yaml — full BNK-on-EKS deployment reference (host-device pattern).
#
# This is the complete topology: VPC + subnets, the BNK external/internal TMM
# data-plane subnets, an EKS control plane + 3-node managed node group, the full
# BNK 2.3 stack, and an optional test jumphost.
#
# It is also the demo cluster: uncomment the `demo:` block below (or pass --demo)
# to unlock the curated protocol walkthroughs, `awsbnkctl demo run …`.
#
# Prerequisites before `up`:
#   aws sso login --profile <your-profile>
#   aws sts get-caller-identity     # sanity check
#
# Usage:
#   awsbnkctl validate examples/full-cluster/cluster.yaml          # no AWS calls
#   awsbnkctl up   --config examples/full-cluster/cluster.yaml --dry-run
#   awsbnkctl up   --config examples/full-cluster/cluster.yaml
#   awsbnkctl down --config examples/full-cluster/cluster.yaml --yes
#   awsbnkctl down --config examples/full-cluster/cluster.yaml --yes --keep-irsa
#
# With demo mode on:
#   awsbnkctl demo list
#   awsbnkctl demo run http2 --config examples/full-cluster/cluster.yaml
#   awsbnkctl demo run --all --config examples/full-cluster/cluster.yaml
#
# State written to: .awsbnkctl/full-cluster/state.env

apiVersion: awsbnkctl/v1
kind: Cluster

metadata:
  name: full-cluster
  region: ap-southeast-2
  labels:
    purpose: bnk-full-cluster

# pattern selects the data-path variant.
# host-device: TMM runs directly on EC2 host NIC interfaces (no SR-IOV vfio).
#              Requires network.dataPath for BNK ext/int subnet creation (phase 03).
#              Activates phases 16 (TMM node label), 17 (secondary ENIs), 18 (IRSA).
pattern: host-device

# demo marks this as a demo deployment. Equivalent to passing --demo on the CLI.
# When enabled, `up` writes DEMO_MODE / DEMO_STAGED_AT / DEMO_EXPIRY to state.env,
# tags every resource with awsbnkctl:demo=true, pre-stages the demo test clients
# on the jumphost, and `down` cleans the demo use-cases first. Requires
# testing.jumphost.enabled: true (every demo use-case drives traffic from it).
#
# ttl is a lifetime HINT only: DEMO_EXPIRY = now + ttl, surfaced as a countdown by
# `awsbnkctl status`. No reaper acts on it — nothing deletes the cluster when it
# expires. Tear it down yourself.
#
# demo:
#   enabled: true
#   ttl: 24h          # optional; default 24h

network:
  vpcCidr: 10.0.0.0/16

  azs:
    - ap-southeast-2a
    - ap-southeast-2b

  subnets:
    public:
      # Public subnets: map-public-ip-on-launch, route 0.0.0.0/0 -> IGW.
      # First public subnet hosts workers/jumphost; second AZ is required for the
      # EKS control plane (needs >= 2 AZs).
      - cidr: 10.0.1.0/24
        az: ap-southeast-2a
      - cidr: 10.0.2.0/24
        az: ap-southeast-2b

    private:
      # Private subnets: no public IP, egress via NAT GW (cost-optimised: 1 NAT).
      - cidr: 10.0.11.0/24
        az: ap-southeast-2a
      - cidr: 10.0.12.0/24
        az: ap-southeast-2b

  # dataPath: BNK data-plane subnet definitions (host-device pattern only).
  # Phase 03 creates these subnets and writes BNK_EXT_SUBNET / BNK_INT_SUBNET to
  # state.env. Phase 17 attaches secondary ENIs from these subnets to the TMM node.
  # These subnets are dedicated to the TMM data path; they do not carry worker or
  # EKS traffic.
  dataPath:
    external:
      cidr: 10.0.10.0/24      # BNK_EXT — TMM client-side VLAN
      az: ap-southeast-2a
    internal:
      cidr: 10.0.20.0/24      # BNK_INT — TMM backend-side VLAN
      az: ap-southeast-2a

  # 1 NAT GW = cost-optimised (single point of egress). For HA, set to len(azs).
  natGateways: 1

# cluster: EKS control plane + managed node group configuration.
# Phases 08 (EKS cluster), 10 (node group), 11 (kubeconfig) require this block.
cluster:
  kubernetesVersion: "1.32"
  nodeGroups:
    - name: default
      # m6i.4xlarge x 3 is the documented BNK 2.3 Small minimum:
      #   - 4+ ENIs: primary + EKS CNI + 2 BNK secondaries (host-device pattern)
      #   - 16 vCPU + 64 GB: fits the full BNK control plane + TMM (2 vCPU / 8 GiB)
      #     packed onto the single labeled node (host-device pins TMM).
      #   - 3 nodes: dSSM quorum.
      # Phase 00 preflight enforces these minimums for pattern: host-device.
      instanceType: m6i.4xlarge
      desiredSize: 3
      minSize: 3
      maxSize: 4
      diskSize: 50

# bnk: BNK supply-chain credentials, required for phase 12.
# Replace farArchive and jwt with paths to your own files before running `up`;
# placeholder paths will cause phase 12 to error at entry. Relative paths resolve
# against the directory holding THIS file, not your shell's working directory.
#
# farArchive: path to F5's FAR pull credentials JSON (from the F5 portal).
#             Type in k8s: kubernetes.io/dockerconfigjson secret named 'far-secret'.
#             F5 ships this file pre-formatted as a dockerconfigjson.
#
# jwt: path to F5's subscription JWT (from the F5 portal / entitlement email).
#      Type in k8s: Opaque secret named 'bnk-license-jwt', key 'license.jwt'.
#
# certManagerVersion: pinned to match the embedded upstream YAML (1.16.1).
#                     Omit to use the default. Mismatch is a hard error.
bnk:
  farArchive: ./cne_pull_64.json     # REPLACE: path to your F5 FAR pull credentials JSON
  jwt: ./license.jwt                  # REPLACE: path to your F5 subscription JWT
  # certManagerVersion: "1.16.1"     # optional; defaults to 1.16.1 (the embedded version)

# addons: optional add-on configuration.
# When omitted, FLO is installed at the pinned default version.
# Uncomment to pin a version or disable FLO explicitly:
#
# addons:
#   flo:
#     version: "v2.21.13-0.0.28"  # optional; defaults to pinned version
#     enabled: true                 # optional; default true; set false to skip FLO + OTEL install

# Optional: provision a multi-ENI jumphost + EICE for test traffic
# against TMM SelfIPs in BNK_EXT (10.0.10.0/24). Default off.
# Requires pattern: host-device and network.dataPath to be set.
testing:
  jumphost:
    enabled: true
    instanceType: t3.small      # optional; default t3.small
    mgmtSubnetIndex: 0           # optional; default 0 (first public subnet)

# forge: register this cluster with a running BNK Forge instance after `up`, and
# unregister on `down`. Forge is the web UI for the *bnkctl tools — set one up
# from https://github.com/f5devcentral/bnk-forge and it serves on :8000.
#
# Left ENABLED on purpose, and harmless if you have no Forge: Phase 09 soft-fails
# when the instance is unreachable — it writes a pending link, warns, and exits 0.
# `up` still succeeds. Set enabled: false below to skip the handoff entirely.
#
# credentialTemplateId=1 is forge's default "AWS Production" template; set to 0 to
# skip credential attachment. The standalone
# `awsbnkctl forge {register,status,unregister} --config <this>` works against the
# same link in the cluster state dir.
#
# Credential resolution (REST login):
#   username: forge.username (yaml) -> default "admin"
#   password: $AWSBNKCTL_FORGE_PASSWORD env -> forge.password (yaml, dev-only)
#             -> default "changeme" (back-compat; a warning is emitted)
#
# Supply the password via the AWSBNKCTL_FORGE_PASSWORD environment variable —
# never write the real password in this file.
forge:
  enabled: true                    # set false to skip the Forge handoff
  url: http://localhost:8000       # also overridable via $AWSBNKCTL_FORGE_URL
  mcpUrl: http://localhost:8081/mcp/
  credentialTemplateId: 1          # forge "AWS Production" template
  username: admin                  # optional; default "admin"
  # password: ""                   # dev-only; prefer $AWSBNKCTL_FORGE_PASSWORD

# bigipVE: opt-in F5 BIG-IP VE appliance for the BIG-IP → BNK migration demo.
# DISABLED by default. Set enabled: true only when you intend to run it, and only
# with demo: enabled above.
#
# WARNING: this provisions a chargeable c5n.2xlarge PAYG BIG-IP VE appliance
# (roughly 15 min extra onboarding, plus ongoing EC2 + licensing costs). Tear it
# down with `awsbnkctl down` to stop the charges.
#
# Admin password: supply via the AWSBNKCTL_BIGIP_PASSWORD environment variable —
# it is NEVER stored in this file.
#
# bigipVE:
#   enabled: false              # set true to provision the BIG-IP VE appliance
#   instanceType: c5n.2xlarge   # default; minimum for PAYG Good/Better/Best
#   mgmtSubnetIndex: 0          # public subnet index for the mgmt ENI (default 0)
#   vip: 10.0.10.120            # BIG-IP virtual-server IP in the external subnet
#   licenseTier: Good           # PAYG tier: Good | Better | Best
#   # version: "17.5.1*"        # optional AMI version glob; omit for newest

# tags merged into every AWS resource alongside the mandatory awsbnkctl:* keys.
tags:
  cost-center: RnD-AI
  env: lab
