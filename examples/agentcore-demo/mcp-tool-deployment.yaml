apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-server-code
  namespace: default
data:
  mcp-server.py: |
    from mcp.server.fastmcp import FastMCP
    import random

    mcp = FastMCP("Finance")

    @mcp.tool()
    def get_forecast(quarter: str) -> str:
        """Get the financial forecast for a given quarter."""
        growth = random.randint(5, 20)
        return f"{quarter} Revenue expected to increase by {growth}%"
  agent-card.json: |
    {
      "name": "Finance Tool",
      "description": "Financial forecasting tool",
      "capabilities": ["mcp"],
      "endpoints": {
        "mcp": "/v1/mcp/forecast"
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-financial-tool
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-financial-tool
  template:
    metadata:
      labels:
        app: mcp-financial-tool
    spec:
      containers:
      - name: mcp-server
        image: python:3.11-slim
        command: ["/bin/sh", "-c"]
        args:
          - "pip install mcp[fastmcp] uvicorn && mcp run /app/mcp-server.py --transport sse --port 8080 --host 0.0.0.0"
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: code
          mountPath: /app
      - name: agent-card-server
        image: nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: code
          mountPath: /usr/share/nginx/html/.well-known
      volumes:
      - name: code
        configMap:
          name: mcp-server-code
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-financial-tool
  namespace: default
spec:
  selector:
    app: mcp-financial-tool
  ports:
    - name: mcp
      protocol: TCP
      port: 80
      targetPort: 8080
    - name: agent-card
      protocol: TCP
      port: 8081
      targetPort: 80
