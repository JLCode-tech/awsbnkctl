apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-server-code
  namespace: default
data:
  mcp-server.py: |
    from mcp.server.fastmcp import FastMCP
    import random

    mcp = FastMCP("Finance")

    @mcp.tool()
    def get_forecast(quarter: str) -> str:
        """Get the financial forecast for a given quarter."""
        growth = random.randint(5, 20)
        return f"{quarter} Revenue expected to increase by {growth}%"

    if __name__ == "__main__":
        mcp.settings.port = 8080
        mcp.settings.host = "0.0.0.0"
        mcp.run(transport="sse")
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-financial-tool
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-financial-tool
  template:
    metadata:
      labels:
        app: mcp-financial-tool
    spec:
      containers:
      - name: mcp-server
        image: python:3.11-slim
        command: ["/bin/sh", "-c"]
        args:
          - "pip install mcp[fastmcp] uvicorn && python /app/mcp-server.py"
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: code
          mountPath: /app
      volumes:
      - name: code
        configMap:
          name: mcp-server-code
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-financial-tool
  namespace: default
spec:
  selector:
    app: mcp-financial-tool
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
