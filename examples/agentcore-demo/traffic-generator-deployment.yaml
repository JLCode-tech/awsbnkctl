apiVersion: v1
kind: ConfigMap
metadata:
  name: traffic-generator-script
  namespace: default
data:
  traffic_gen.py: |
    import json
    import os
    import random
    import time
    import urllib.request
    import urllib.error

    SYMBOLS = ["MSFT", "AAPL", "NVDA", "AMZN", "GOOG", "META", "TSLA"]
    VIP = os.environ.get("BNK_VIP", "10.0.10.150")
    INGRESS_HOST = os.environ.get("INGRESS_HOST", "bnk-ingress.bnk-demo.internal")
    MCP_URL = f"http://{VIP}/v1/mcp/forecast"
    DISC_URL = f"http://{VIP}/.well-known/agent-card.json"
    SHIPPER_URL = os.environ.get("SHIPPER_URL", "http://bedrock-token-shipper.llm-egress.svc.cluster.local:9090")
    AGENT_TOKEN = os.environ["AGENT_TOKEN"]
    EXTERNAL_TOKEN = os.environ["EXTERNAL_TOKEN"]
    INTERVAL_S = int(os.environ.get("INTERVAL_S", "30"))

    def post_json(url, data, headers=None, timeout=5):
        h = {"Content-Type": "application/json", "Host": INGRESS_HOST, "Accept": "application/json"}
        if headers:
            h.update(headers)
        req = urllib.request.Request(
            url,
            data=json.dumps(data, separators=(',', ':')).encode("utf-8"),
            headers=h
        )
        try:
            with urllib.request.urlopen(req, timeout=timeout) as resp:
                return resp.status
        except urllib.error.HTTPError as e:
            return e.code
        except Exception:
            return 0

    def get(url, headers=None, timeout=5):
        h = {"Host": INGRESS_HOST, "Accept": "application/json"}
        if headers:
            h.update(headers)
        req = urllib.request.Request(url, headers=h)
        try:
            with urllib.request.urlopen(req, timeout=timeout) as resp:
                return resp.status
        except urllib.error.HTTPError as e:
            return e.code
        except Exception:
            return 0

    print("Starting continuous dual-leg traffic generator (AWS AgentCore / Bedrock + F5 BNK)...", flush=True)
    cycle = 0
    while True:
        cycle += 1
        sym = random.choice(SYMBOLS)
        ptk = random.randint(240, 420)
        ctk = random.randint(150, 310)
        lat = random.randint(310, 620)

        # Leg A: a simulated model call. Token counts, latency and therefore
        # cost are random; the shipper labels the record source=synthetic.
        model_rec = {
            "job": "llm-gateway",
            "model": "claude-3-5-sonnet",
            "source": "synthetic",
            "status": "200",
            "prompt_tk": ptk,
            "comp_tk": ctk,
            "latency_ms": lat,
            "userq": "Forecast " + sym + " financial metrics for 30 days",
            "caller": "traffic-generator",
            "client": "traffic-generator",
            "action": "allow",
            "req_body": "{\"prompt\":\"Evaluate quarterly earnings trajectory and risk profile for " + sym + ".\"}",
            "resp_body": "{\"forecast\":\"" + sym + " 30-day projection: steady trajectory, governed by F5 BNK.\"}"
        }
        s_res = post_json(SHIPPER_URL, model_rec, headers={"Host": "bedrock-token-shipper.llm-egress.svc.cluster.local"})

        # Leg B1: Trusted forecast (200 OK)
        fc_body = {
            "jsonrpc": "2.0",
            "id": 1,
            "method": "tools/call",
            "params": {"name": "forecast", "arguments": {"symbol": sym, "days": 30}}
        }
        f_res = post_json(
            MCP_URL,
            fc_body,
            {"Authorization": "Bearer " + AGENT_TOKEN}
        )

        # Leg B2: Unauthorized balance (403 Forbidden by BNK policy)
        bal_body = {
            "jsonrpc": "2.0",
            "id": 2,
            "method": "tools/call",
            "params": {"name": "get_account_balance", "arguments": {"account_id": "ACC-1001"}}
        }
        b_res = post_json(
            MCP_URL,
            bal_body,
            {"Authorization": "Bearer " + EXTERNAL_TOKEN}
        )

        # Leg B3: Discovery (200 OK)
        d_res = get(DISC_URL)

        # Leg B4: Unauthenticated (401 Unauthorized)
        u_res = post_json(MCP_URL, fc_body)

        ts = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
        print("[" + ts + "] Wave " + str(cycle) + " -> Model:" + sym + " (Loki:" + str(s_res) + ", " + str(ptk+ctk) + " tk) | MCP forecast:" + str(f_res) + " bal:" + str(b_res) + " disc:" + str(d_res) + " unauth:" + str(u_res), flush=True)
        time.sleep(INTERVAL_S)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentcore-traffic-generator
  namespace: default
  labels:
    app: agentcore-traffic-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agentcore-traffic-generator
  template:
    metadata:
      labels:
        app: agentcore-traffic-generator
    spec:
      containers:
      - name: traffic-gen
        image: python:3.11-slim
        command: ["python3", "-u", "/app/traffic_gen.py"]
        env:
        # rebuild.sh fills BNK_VIP from the live Gateway; edit by hand when
        # applying this file directly.
        - name: BNK_VIP
          value: "10.0.10.150"
        - name: INGRESS_HOST
          value: bnk-ingress.bnk-demo.internal
        # The two demo bearer tokens; the same literals mcp-tool/kustomization.yaml
        # gives the MCP server and mcp-security-policy.yaml checks in the iRule.
        - name: AGENT_TOKEN
          value: demo-agent-token-a7f3c1
        - name: EXTERNAL_TOKEN
          value: demo-external-token-4b9e2d
        - name: INTERVAL_S
          value: "30"
        volumeMounts:
        - name: code
          mountPath: /app
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 150m
            memory: 128Mi
      volumes:
      - name: code
        configMap:
          name: traffic-generator-script
