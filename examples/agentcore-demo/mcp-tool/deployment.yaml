# The MCP finance tool the AgentCore agent calls through the BNK VIP.
#
# The `mcp-server-code` ConfigMap referenced below is NOT defined here — it is
# generated from mcp-server.py by kustomization.yaml, which also rewrites this
# reference to the hashed name. Apply the directory, not this file alone.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-financial-tool
  labels:
    app: mcp-financial-tool
    app.kubernetes.io/part-of: bnk-agentcore-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-financial-tool
  template:
    metadata:
      labels:
        app: mcp-financial-tool
    spec:
      containers:
      - name: mcp-server
        image: python:3.11-slim
        command:
        - /bin/sh
        - -c
        args:
        - pip install fastmcp uvicorn starlette httpx -q && python /app/mcp-server.py
        ports:
        - containerPort: 8080
          name: mcp
        readinessProbe:
          httpGet:
            path: /.well-known/agent-card.json
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - mountPath: /app
          name: code
      volumes:
      - name: code
        configMap:
          name: mcp-server-code
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-financial-tool
  labels:
    app: mcp-financial-tool
    app.kubernetes.io/part-of: bnk-agentcore-demo
spec:
  selector:
    app: mcp-financial-tool
  ports:
  - name: a2a
    port: 80
    protocol: TCP
    targetPort: 8080
