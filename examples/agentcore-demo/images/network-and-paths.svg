<text x="40" y="972" font-family="-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7785" font-weight="normal" text-anchor="start">Everything inside the VPC frame is ours to control. Paths 1 and 3 terminate on the same VIP and the same route — one policy surface, whatever door the traffic came</text>
<text x="40" y="988" font-family="-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7785" font-weight="normal" text-anchor="start">through. Nothing reaches the pod without passing TMM. The runtime is multi-homed across both AZs, so one logical agent presents two source IPs — which is why the</text>
<text x="40" y="1004" font-family="-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7785" font-weight="normal" text-anchor="start">rate limiter keys on caller identity, not client IP.</text>
