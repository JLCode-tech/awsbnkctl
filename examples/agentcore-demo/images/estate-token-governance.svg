<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 700" width="1180" height="700">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa5b1"/></marker></defs>
<rect width="1180" height="700" fill="#ffffff"/>
<text x="40" y="44" font-family="-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="23" fill="#1c2530" font-weight="700" text-anchor="start">Token governance across the AWS AI estate</text>
<text x="40" y="68" font-family="-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="13" fill="#6b7785" font-weight="normal" text-anchor="start">AgentCore Gateway meters its own path. BNK can meter everything you route through it.</text>
<text x="40" y="112" font-family="-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7785" font-weight="700" text-anchor="start">WHERE THE TOKENS ARE BURNED</text>
<rect x="40" y="128" width="330" height="36" rx="7" fill="#fff" stroke="#9aa5b1" stroke-width="1.4"/>
<text x="54" y="151" font-family="-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1c2530" font-weight="600" text-anchor="start">Agent via AgentCore Gateway</text>
<rect x="378" y="134" width="96" height="24" rx="7" fill="#fff8ee" stroke="#ff9900" stroke-width="1.2"/>
<text x="426" y="150" font-family="-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="9.5" fill="#8a5200" font-weight="700" text-anchor="middle">AWS TPM</text>
<line x1="486" y1="146" x2="560" y2="146" stroke="#9aa5b1" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="40" y="174" width="330" height="36" rx="7" fill="#fff" stroke="#9aa5b1" stroke-width="1.4"/>
<text x="54" y="197" font-family="-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1c2530" font-weight="600" text-anchor="start">Agents on EKS / ECS / EC2</text>
<line x1="486" y1="192" x2="560" y2="192" stroke="#9aa5b1" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="40" y="220" width="330" height="36" rx="7" fill="#fff" stroke="#9aa5b1" stroke-width="1.4"/>
<text x="54" y="243" font-family="-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1c2530" font-weight="600" text-anchor="start">Self-hosted vLLM / NIM on GPU nodes</text>
<line x1="486" y1="238" x2="560" y2="238" stroke="#9aa5b1" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="40" y="266" width="330" height="36" rx="7" fill="#fff" stroke="#9aa5b1" stroke-width="1.4"/>
<text x="54" y="289" font-family="-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1c2530" font-weight="600" text-anchor="start">Third-party LLM APIs (OpenAI, …)</text>
<line x1="486" y1="284" x2="560" y2="284" stroke="#9aa5b1" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="40" y="312" width="330" height="36" rx="7" fill="#fff" stroke="#9aa5b1" stroke-width="1.4"/>
<text x="54" y="335" font-family="-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1c2530" font-weight="600" text-anchor="start">SageMaker endpoints</text>
<line x1="486" y1="330" x2="560" y2="330" stroke="#9aa5b1" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="40" y="358" width="330" height="36" rx="7" fill="#fff" stroke="#9aa5b1" stroke-width="1.4"/>
<text x="54" y="381" font-family="-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1c2530" font-weight="600" text-anchor="start">Batch / offline inference</text>
<line x1="486" y1="376" x2="560" y2="376" stroke="#9aa5b1" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="40" y="404" width="330" height="36" rx="7" fill="#f4f6f8" stroke="#d8dee5" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="54" y="427" font-family="-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7785" font-weight="600" text-anchor="start">Apps calling Bedrock over the AWS backbone</text>
<text x="486" y="426" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" fill="#6b7785" font-weight="italic" text-anchor="start">not in path</text>
<rect x="560" y="128" width="250" height="268" rx="7" fill="#fff" stroke="#e4002b" stroke-width="2"/>
<text x="685" y="156" font-family="-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="14" fill="#1c2530" font-weight="700" text-anchor="middle">F5 BNK</text>
<text x="685" y="174" font-family="-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="10" fill="#6b7785" font-weight="normal" text-anchor="middle">one enforcement point</text>
<text x="578" y="204" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" fill="#1c2530" font-weight="normal" text-anchor="start">• per-user / per-model limits</text>
<text x="578" y="226" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" fill="#1c2530" font-weight="normal" text-anchor="start">• 429 when a budget is spent</text>
<text x="578" y="248" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" fill="#1c2530" font-weight="normal" text-anchor="start">• counts persisted in dSSM</text>
<text x="578" y="270" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" fill="#1c2530" font-weight="normal" text-anchor="start">• HSL export for chargeback</text>
<text x="578" y="292" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" fill="#1c2530" font-weight="normal" text-anchor="start">• one policy, not one per gateway</text>
<text x="685" y="336" font-family="-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="9.5" fill="#b4232c" font-weight="700" text-anchor="middle">parses OpenAI-shaped usage</text>
<text x="685" y="352" font-family="-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="9.5" fill="#b4232c" font-weight="600" text-anchor="middle">Bedrock-native meters ZERO today</text>
<text x="685" y="376" font-family="-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="9" fill="#6b7785" font-weight="normal" text-anchor="middle">see §4.3 — F5 feature request</text>
<line x1="810" y1="200" x2="880" y2="200" stroke="#9aa5b1" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="880" y="172" width="250" height="58" rx="7" fill="#fff" stroke="#9aa5b1" stroke-width="1.4"/>
<text x="1005.0" y="198.0" font-family="-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1c2530" font-weight="600" text-anchor="middle">Metering / chargeback</text>
<text x="1005.0" y="215.0" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" fill="#6b7785" font-weight="normal" text-anchor="middle">OpenMeter · per team, per model</text>
<line x1="810" y1="300" x2="880" y2="300" stroke="#9aa5b1" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="880" y="272" width="250" height="58" rx="7" fill="#fff" stroke="#9aa5b1" stroke-width="1.4"/>
<text x="1005.0" y="298.0" font-family="-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1c2530" font-weight="600" text-anchor="middle">BNK Forge</text>
<text x="1005.0" y="315.0" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" fill="#6b7785" font-weight="normal" text-anchor="middle">usage · latency · refusals</text>
<rect x="40" y="452" width="1090" height="92" rx="7" fill="#f6f8fa" stroke="#e3e8ee" stroke-width="1"/>
<text x="60" y="480" font-family="-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="12" fill="#1c2530" font-weight="700" text-anchor="start">The question this answers</text>
<text x="60" y="502" font-family="-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1c2530" font-weight="600" text-anchor="start">“What is our AI spend, by team, and who is about to blow the budget?”</text>
<text x="60" y="524" font-family="-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7785" font-weight="normal" text-anchor="start">The Gateway limiter answers it for one row. An in-path layer answers it for the estate.</text>
<text x="40" y="580" font-family="-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#b4232c" font-weight="700" text-anchor="start">HONEST LIMITS</text>
<text x="40" y="600" font-family="-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7785" font-weight="normal" text-anchor="start">• BNK must be in the path — it cannot meter a Lambda's Bedrock call that never traverses it (bottom row).</text>
<text x="40" y="618" font-family="-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7785" font-weight="normal" text-anchor="start">• Token counting parses OpenAI-shaped usage. Bedrock returns inputTokens/outputTokens and meters as zero today.</text>
<text x="40" y="636" font-family="-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7785" font-weight="normal" text-anchor="start">• AgentCore Gateway TPM is real on its own path — but path-scoped, excludes pass-through, and fails open.</text>
</svg>