# Egress for the three local-zone test namespaces: one GatewaySettings
# egressConfigs entry (Automap on the dual-interface tunnel VLAN int-vlan-infra)
# and an EgressGateway that selects the namespaces. Apply with the cluster
# config so {{.GATEWAYCLASS_NAME}} is filled from state:
#   awsbnkctl k apply --config <cluster.yaml> -f examples/local-zone/manifests/egress.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: local-zone-egress
---
apiVersion: gateway.k8s.f5.com/v1alpha1
kind: GatewaySettings
metadata:
  name: perth-test-egress
  namespace: local-zone-egress
spec:
  egressConfigs:
  - name: default-egress
    networkRef:
      name: int-vlan-infra
    sourceNATConfig:
      type: Automap
---
apiVersion: gateway.k8s.f5.com/v1alpha1
kind: EgressGateway
metadata:
  name: perth-test-egress
  namespace: local-zone-egress
spec:
  gatewayClassName: {{.GATEWAYCLASS_NAME}}
  infrastructure:
    parametersRef:
      name: perth-test-egress
      sectionName: default-egress
  sourceSelector:
    selectionMode: NamespaceSelector
    namespaces:
      matchNames:
      - http2-scenario
      - diameter-scenario
      - sctp-scenario
