# Diameter (TCP 3868) reference: GatewaySettings, backend, Gateway with a
# static VIP inside the Infra listener pool, L4Route. Apply with the cluster
# config so {{.GATEWAYCLASS_NAME}} is filled from state:
#   awsbnkctl k apply --config <cluster.yaml> -f examples/local-zone/manifests/diameter.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: diameter-scenario
---
apiVersion: gateway.k8s.f5.com/v1alpha1
kind: GatewaySettings
metadata:
  name: diameter-scenario
  namespace: diameter-scenario
spec:
  ingressConfig:
    defaultListenerNetwork:
      ipamRefs:
      - name: listener-pool
      networkRefs:
      - name: ext-vlan-infra
      sourceNATConfig:
        type: Automap
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: diameter-backend
  namespace: diameter-scenario
spec:
  replicas: 1
  selector:
    matchLabels:
      app: diameter
  template:
    metadata:
      labels:
        app: diameter
    spec:
      containers:
      - name: diameter
        image: nicolaka/netshoot
        command: ["socat", "TCP-LISTEN:3868,fork", "EXEC:'echo Diameter OK'"]
        ports:
        - containerPort: 3868
          protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: diameter-backend
  namespace: diameter-scenario
spec:
  selector:
    app: diameter
  ports:
  - port: 3868
    targetPort: 3868
    protocol: TCP
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: diameter-gateway
  namespace: diameter-scenario
spec:
  gatewayClassName: {{.GATEWAYCLASS_NAME}}
  infrastructure:
    parametersRef:
      group: gateway.k8s.f5.com
      kind: GatewaySettings
      name: diameter-scenario
  addresses:
  - type: IPAddress
    value: 10.0.10.122
  listeners:
  - name: diameter-listen
    protocol: TCP
    port: 3868
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: gateway.k8s.f5.com/v1
kind: L4Route
metadata:
  name: diameter-route
  namespace: diameter-scenario
spec:
  protocol: TCP
  parentRefs:
  - name: diameter-gateway
    sectionName: diameter-listen
  rules:
  - backendRefs:
    - name: diameter-backend
      port: 3868
