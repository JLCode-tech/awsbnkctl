apiVersion: v1
kind: Namespace
metadata:
  name: http2-scenario
---
apiVersion: k8s.f5net.com/v1
kind: F5BnkGateway
metadata:
  name: http2-vip-pool
  namespace: http2-scenario
spec:
  ingressConfig:
    defaultListenerNetworks:
    - name: ext
      ipv4BaseCidr: "10.0.10.202/32"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: http2-backend
  namespace: http2-scenario
spec:
  replicas: 1
  selector:
    matchLabels:
      app: http2
  template:
    metadata:
      labels:
        app: http2
    spec:
      containers:
      - name: http2
        # Use an image that replies with HTTP/2 (traefik, nghttp2, or python)
        image: kennethreitz/httpbin
        command: ["gunicorn", "-b", "0.0.0.0:8000", "httpbin:app", "-k", "gevent"]
        ports:
        - containerPort: 8000
          protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: http2-backend
  namespace: http2-scenario
spec:
  selector:
    app: http2
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: Gateway
metadata:
  name: http2-gateway
  namespace: http2-scenario
spec:
  gatewayClassName: bnk-perth-lz-gatewayclass
  addresses:
  - type: IPAddress
    value: 10.0.10.202
  listeners:
  - name: http2-listen
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: http2-route
  namespace: http2-scenario
spec:
  parentRefs:
  - name: http2-gateway
    sectionName: http2-listen
  rules:
  - backendRefs:
    - name: http2-backend
      port: 8000
