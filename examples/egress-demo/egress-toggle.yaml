# BNK egress demo — THE TOGGLE. See examples/egress-demo/README.md.
#
#   BNK ON :  awsbnkctl k apply --config examples/egress-demo/cluster.yaml -f examples/egress-demo/egress-toggle.yaml
#   BNK OFF:  kubectl delete -n bnk-egress-demo egressgateway bnk-egress-demo
#
#   Watch from the pod:
#     kubectl exec -it -n bnk-egress-demo deploy/agent -c nginx -- sh /demo/watch.sh
#
#   ON  -> the internet sees the NAT gateway address (traffic left via TMM)
#   OFF -> the internet sees the node's public IP (traffic left via the node)
#
# A GatewaySettings with one egressConfigs entry and an EgressGateway that
# references it (same namespace) and selects the captured namespace.
# {{.GATEWAYCLASS_NAME}} is filled from the cluster state by
# `awsbnkctl k apply --config`. The tunnel VLAN and the TMM routes come from
# the Infra CR `up` applied (external-only => ext-vlan-infra).
apiVersion: gateway.k8s.f5.com/v1alpha1
kind: GatewaySettings
metadata:
  name: bnk-egress-demo
  namespace: bnk-egress-demo
spec:
  egressConfigs:
  - name: demo-egress
    networkRef:
      name: ext-vlan-infra
    sourceNATConfig:
      type: Automap
---
apiVersion: gateway.k8s.f5.com/v1alpha1
kind: EgressGateway
metadata:
  name: bnk-egress-demo
  namespace: bnk-egress-demo
spec:
  gatewayClassName: {{.GATEWAYCLASS_NAME}}
  infrastructure:
    parametersRef:
      name: bnk-egress-demo
      sectionName: demo-egress
  sourceSelector:
    selectionMode: NamespaceSelector
    namespaces:
      matchNames:
      - bnk-egress-demo
