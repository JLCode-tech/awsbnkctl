# gitleaks configuration for awsbnkctl.
# CI runs gitleaks via the security-audit job in .github/workflows/ci.yml.
# This file extends the default ruleset and allowlists known false positives.
title = "awsbnkctl gitleaks config"

[extend]
useDefault = true

[allowlist]
description = """
internal/exec/k8s.go, internal/forge, internal/k8s/manifests, and examples/ hold only
exec-backend plumbing, test templates, and synthetic demo virtual keys (no real credentials).
"""
paths = [
  '''internal/exec/k8s\.go''',
  '''internal/forge/.*''',
  '''internal/k8s/manifests/.*''',
  '''examples/.*''',
]
