apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: http2-gateway
  namespace: {{.Namespace}}
spec:
  gatewayClassName: {{.GatewayClassName}}
  infrastructure:
    parametersRef:
      group: gateway.k8s.f5.com
      kind: GatewaySettings
      name: demo-http2
  addresses:
  - type: IPAddress
    value: {{.VIP}}
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces: {from: Same}
