# CI FIXTURE — not a published example. Do not copy this to start a cluster.
#
# This is the sriov-external pattern's only end-to-end exercise: CI runs
# `validate` plus `up`/`down --dry-run` against it so the pattern's phase
# branches (17 ENI attach, 20 NAD, 20b vfio-node-prep, 23b vlan/GatewayClass)
# stay covered. The user-facing config lives in examples/external-only/cluster.yaml
# as a documented one-line `pattern:` swap.
#
# Referenced by .github/workflows/ci.yml, scripts/test-integration-aws.sh, and
# internal/intent/{gpu,sagemaker}_test.go. Keep it in sync with
# examples/external-only/cluster.yaml.
#
# cluster.yaml — sriov-external (single-interface, SR-IOV/vfio DPDK) BNK-on-EKS.
#
# Pattern C: like external-only (ONE external/ingress interface, CNI backend) but
# TMM drives the data plane via DPDK over the ENA bound to vfio-pci, instead of
# the kernel socket driver. EXPERIMENTAL — validated end-to-end live (HTTP 200
# through TMM-on-vfio).
#
# How it differs from external-only (host-device/sock):
#   - The external ENA is bound to vfio-pci (No-IOMMU) on the node by the
#     vfio-node-prep DaemonSet (Phase 20b). Stock AL2023 — no custom AMI.
#   - The sriov-network-device-plugin exposes it as resource intel.com/ens8;
#     the NAD is `external-sriov` (type: passthru, NOT sriov-cni).
#   - The CNEInstance drops TMM_GENERIC_SOCKET_DRIVER → TMM uses the DPDK/vfio
#     driver; the device plugin injects /dev/vfio + PCIDEVICE_INTEL_COM_ENS8.
#   - Single external ENI (preflight floor 2); no internal interface.
#
# To run this pattern for real, copy examples/external-only/cluster.yaml and set
# `pattern: sriov-external` — that file documents the swap.

apiVersion: awsbnkctl/v1
kind: Cluster

metadata:
  name: bnk-sriov
  region: ap-southeast-2
  labels:
    purpose: bnk-sriov-external

# sriov-external: single external interface via SR-IOV/vfio-pci DPDK, CNI backend.
pattern: sriov-external

network:
  vpcCidr: 10.0.0.0/16

  azs:
    - ap-southeast-2a
    - ap-southeast-2b

  subnets:
    public:
      - cidr: 10.0.1.0/24
        az: ap-southeast-2a
      - cidr: 10.0.2.0/24
        az: ap-southeast-2b
    private:
      - cidr: 10.0.11.0/24
        az: ap-southeast-2a
      - cidr: 10.0.12.0/24
        az: ap-southeast-2b

  # dataPath: external subnet ONLY for single-interface patterns. The default
  # Gateway VIP is derived as <external network>.100 (10.0.10.100) and the TMM
  # external SelfIP as <subnet>.240 (10.0.10.240) unless overridden. Do NOT add
  # an `internal:` block here — validation rejects it for every single-interface
  # pattern, sriov-external included.
  dataPath:
    external:
      cidr: 10.0.10.0/24      # BNK_EXT — TMM client-side / ingress VLAN
      az: ap-southeast-2a

  natGateways: 1

# cluster: EKS control plane + managed node group. sriov-external defaults match
# the other BNK patterns: instanceType m6i.4xlarge, desired/min 3, max 4,
# role=bnk on the first node group (3 nodes for the dSSM quorum).
cluster:
  kubernetesVersion: "1.35"
  nodeGroups:
    - name: default
      instanceType: m6i.4xlarge
      desiredSize: 3
      minSize: 3
      maxSize: 4
      diskSize: 50

# bnk: F5 supply-chain credentials, required by Phase 12. Replace both paths with
# your own files before running `up`. Relative paths resolve against the
# directory holding THIS file, not your shell's working directory. Both names are
# gitignored (cne_pull_64.json, *.jwt) so they are never committed.
bnk:
  farArchive: ./cne_pull_64.json     # REPLACE with your F5 FAR pull credentials JSON
  jwt: ./license.jwt                 # REPLACE with your F5 subscription JWT

# testing.jumphost works for sriov-external too — it lives in the BNK_EXT subnet,
# which every BNK pattern creates. Use it to curl the VIP without standing up EC2.
testing:
  jumphost:
    enabled: true
    instanceType: t3.small
    mgmtSubnetIndex: 0

tags:
  env: dev
