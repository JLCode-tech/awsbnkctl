---
# HuggingFace token: mount the hf-token Secret if the model is gated.
# In synthetic mode (llm-d-inference-sim), no GPU or HF token is required.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: {{.Namespace}}
  labels:
    app: vllm
spec:
  replicas: {{if .Synthetic}}{{.Replicas}}{{else}}1{{end}}
  # Recreate strategy: prevents RollingUpdate deadlock on single-GPU nodes.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      enableServiceLinks: false
{{if not .Synthetic}}
      # Target GPU nodes: the GPU nodegroup is tainted nvidia.com/gpu=present:NoSchedule
      # and labelled awsbnkctl.io/gpu=true. Both nodeSelector and toleration are required.
      nodeSelector:
        awsbnkctl.io/gpu: "true"
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
{{end}}
      containers:
      - name: vllm
{{if .Synthetic}}
        image: {{.Image}}
        command:
        - python3
        - -u
        - -c
        - |
          import http.server, socketserver, json, time, sys

          class ThreadingHTTPServer(socketserver.ThreadingMixIn, http.server.HTTPServer):
              daemon_threads = True

          class SimHandler(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path in ("/health", "/healthz"):
                      resp = b'{"status":"ok"}'
                      self.send_response(200)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(resp)))
                      self.end_headers()
                      self.wfile.write(resp)
                  elif self.path.startswith("/v1/models"):
                      models_resp = {"object": "list", "data": [{"id": "{{.ServedModelName}}", "object": "model"} ] }
                      resp = json.dumps(models_resp).encode("utf-8")
                      self.send_response(200)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(resp)))
                      self.end_headers()
                      self.wfile.write(resp)
                  else:
                      self.send_response(404)
                      self.end_headers()

              def do_POST(self):
                  length = int(self.headers.get("Content-Length", 0))
                  body = self.rfile.read(length) if length > 0 else b"{ }"
                  try:
                      req = json.loads(body)
                  except Exception:
                      req = { }
                  stream = req.get("stream", False)
                  model = req.get("model", "{{.ServedModelName}}")
                  ttft = {{.TTFTBaseMs}} / 1000.0
                  itl = {{.ITLMs}} / 1000.0
                  if stream:
                      self.close_connection = True
                      self.send_response(200)
                      self.send_header("Content-Type", "text/event-stream")
                      self.send_header("Cache-Control", "no-cache")
                      self.send_header("Connection", "close")
                      self.end_headers()
                      time.sleep(ttft)
                      d1 = {"role": "assistant", "content": "Synthetic response from "}
                      chunk1 = {"id": "chatcmpl-sim", "object": "chat.completion.chunk", "created": int(time.time()), "model": model, "choices": [{"index": 0, "delta": d1, "finish_reason": None} ] }
                      self.wfile.write(f"data: {json.dumps(chunk1)}\n\n".encode("utf-8"))
                      self.wfile.flush()
                      time.sleep(itl)
                      d2 = {"content": "F5 BIG-IP Next for Kubernetes simulation.\n"}
                      chunk2 = {"id": "chatcmpl-sim", "object": "chat.completion.chunk", "created": int(time.time()), "model": model, "choices": [{"index": 0, "delta": d2, "finish_reason": None} ] }
                      self.wfile.write(f"data: {json.dumps(chunk2)}\n\n".encode("utf-8"))
                      self.wfile.flush()
                      time.sleep(itl)
                      d3 = { }
                      usage = {"prompt_tokens": 12, "completion_tokens": 10, "total_tokens": 22}
                      chunk3 = {"id": "chatcmpl-sim", "object": "chat.completion.chunk", "created": int(time.time()), "model": model, "choices": [{"index": 0, "delta": d3, "finish_reason": "stop"} ], "usage": usage}
                      self.wfile.write(f"data: {json.dumps(chunk3)}\n\n".encode("utf-8"))
                      self.wfile.write(b"data: [DONE]\n\n")
                      self.wfile.flush()
                  else:
                      time.sleep(ttft + itl*2)
                      msg = {"role": "assistant", "content": "Synthetic response from F5 BIG-IP Next for Kubernetes simulation."}
                      usage = {"prompt_tokens": 12, "completion_tokens": 10, "total_tokens": 22}
                      resp = {"id": "chatcmpl-sim", "object": "chat.completion", "created": int(time.time()), "model": model, "choices": [{"index": 0, "message": msg, "finish_reason": "stop"} ], "usage": usage}
                      resp_bytes = json.dumps(resp).encode("utf-8")
                      self.send_response(200)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(resp_bytes)))
                      self.end_headers()
                      self.wfile.write(resp_bytes)

              def log_message(self, format, *args):
                  sys.stderr.write("%s - - [%s] %s\n" % (self.client_address[0], self.log_date_time_string(), format % args))

          srv = ThreadingHTTPServer(("0.0.0.0", 8000), SimHandler)
          print("Synthetic vLLM simulation server listening on port 8000")
          srv.serve_forever()
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 2
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
{{else}}
        image: vllm/vllm-openai:latest
        args:
        - --model
        - meta-llama/Meta-Llama-3-8B-Instruct
        - --served-model-name
        - llama3
        - --port
        - "8000"
        ports:
        - containerPort: 8000
        env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: token
              # optional: true so the pod starts even without the Secret;
              # the model pull will fail at runtime if the model requires auth.
              optional: true
        - name: HUGGING_FACE_HUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: token
              optional: true
        resources:
          requests:
            nvidia.com/gpu: "1"
            # Sized to fit g5.xlarge allocatable (~3.92 CPU / ~14.4 GiB after
            # kubelet/system/DaemonSet reservations). Verified live 2026-06-13.
            memory: 8Gi
            cpu: "2"
          limits:
            nvidia.com/gpu: "1"
            memory: 14Gi
            cpu: 3500m
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 120
          periodSeconds: 15
          failureThreshold: 20
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 180
          periodSeconds: 30
          failureThreshold: 5
{{end}}
---
apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: {{.Namespace}}
spec:
  selector:
    app: vllm
  ports:
  - name: http
    port: 80
    targetPort: 8000
